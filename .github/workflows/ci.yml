name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check installer syntax
        run: zsh -n install.sh
      - name: Check remote installer path
        run: |
          cd "$(mktemp -d)"
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | WW_GITHUB_TOKEN="${{ github.token }}" WW_INSTALL_DRY_RUN=1 zsh
      - name: Check
        run: cargo check --locked
      - name: Test
        run: cargo test --locked
