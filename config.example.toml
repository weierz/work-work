[search]
# The first display-on event inside this window is the daily start time.
start_time = "05:00:00"
end_time = "14:00:00"

[time_accounting]
# The final display-off event inside this window is the daily end time.
reasonable_end_start = "15:00:00"
reasonable_end_end = "23:00:00"
break_start = "12:00:00"
break_end = "13:00:00"
daily_target_minutes = 480
anomaly_threshold_minutes = 60
monthly_summary_day = 15

[schedule]
max_end_time = "19:00:00"
reminder_minutes = 10

# Rules are evaluated from top to bottom. The first matching `until` wins.
[[schedule.rules]]
until = "10:00:00"
kind = "add_duration"
duration_minutes = 540

[[schedule.rules]]
until = "13:00:00"
kind = "fixed"
end_time = "18:00:00"

[[schedule.rules]]
until = "14:00:00"
kind = "carry_delay"
anchor_start = "13:00:00"
anchor_end = "18:00:00"

[automation]
# Record once per day, after the display-event search window has ended.
daily_record_time = "14:05:00"

# The lightweight tick refreshes the last display-off time, sends due reminders,
# and sends the previous month's summary on monthly_summary_day.
reminder_check_seconds = 60
